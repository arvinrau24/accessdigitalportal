<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Detail — AccessDigital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/client-portal/public/css/app.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark" style="background: var(--ad-primary);">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand mb-0" href="/client-portal/admin/dashboard">AccessDigital Admin</a>
      <button class="btn btn-sm btn-outline-light" onclick="goBack()">Back</button>
    </div>
  </nav>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div>
        <h1 class="h4 mb-1" id="company-name">Client Detail</h1>
        <p class="text-muted mb-0" id="client-meta"></p>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-success" id="btn-approve">Approve</button>
        <button class="btn btn-danger" id="btn-reject">Reject</button>
        <button class="btn btn-outline-danger" id="btn-delete">Delete</button>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-md-4">
        <div class="card p-3">
          <h2 class="h6">Status</h2>
          <div id="status-badge" class="mb-2"></div>
          <div id="rejection-reason" class="text-danger small"></div>
        </div>
      </div>
      <div class="col-md-8">
        <div class="card p-3">
          <h2 class="h6">Onboarding Form</h2>
          <a href="#" id="pdf-link" class="btn btn-sm btn-outline-primary disabled mb-3">Download PDF</a>
          <div id="onboarding-fields" class="small text-muted">No onboarding data yet.</div>
        </div>
      </div>
    </div>

    <div class="card mt-3 p-3">
      <h2 class="h6">Uploaded Documents</h2>
      <div id="docs-list" class="text-muted">Loading...</div>
    </div>

    <div class="card mt-3 p-3">
      <h2 class="h6">Filled Forms</h2>
      <div id="template-uploads-list" class="text-muted">Loading...</div>
    </div>

    <div class="card mt-3 p-3">
      <h2 class="h6">Review History</h2>
      <div id="review-log" class="text-muted">Loading...</div>
    </div>
  </div>

  <div class="modal fade" id="rejectModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Reject Submission</h5></div>
        <div class="modal-body">
          <label class="form-label">Reason (required)</label>
          <textarea class="form-control" id="reject-reason" rows="3" required></textarea>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-danger" id="confirm-reject">Reject</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/client-portal/public/js/api.js"></script>
  <script src="/client-portal/public/js/admin/client-detail.js"></script>
</body>
</html>
