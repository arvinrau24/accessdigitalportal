<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Client — AccessDigital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/client-portal/public/css/app.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark" style="background: var(--ad-primary);">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand mb-0" href="/client-portal/admin/dashboard">AccessDigital Admin</a>
      <button class="btn btn-sm btn-outline-light" onclick="goBack()">Back</button>
    </div>
  </nav>
  <div class="container py-4">
    <h1 class="h4 mb-3">Create New Client</h1>
    <div class="card p-4" style="max-width: 640px;">
      <form id="client-form">
        <div class="mb-3">
          <label class="form-label">Company Name</label>
          <input type="text" class="form-control" name="company_name" required>
        </div>
        <div class="mb-3">
          <label class="form-label d-block">Client Type</label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="client_type" value="A" id="typeA" required>
            <label class="form-check-label" for="typeA">Type A</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="client_type" value="B" id="typeB">
          <label class="form-check-label" for="typeB">Type B</label>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label d-block">Commercial Mode</label>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="commercial_mode" value="Outright Purchase" id="mode1" required>
            <label class="form-check-label" for="mode1">Outright Purchase</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="commercial_mode" value="Lease to Own" id="mode2">
            <label class="form-check-label" for="mode2">Lease to Own</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="commercial_mode" value="Rent" id="mode3">
            <label class="form-check-label" for="mode3">Rent</label>
          </div>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Create Client</button>
          <a href="/client-portal/admin/dashboard" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="passwordModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Client Created</h5>
        </div>
        <div class="modal-body">
          <p>Share these credentials with the client <strong>once</strong>. They will not be shown again.</p>
          <dl class="row mb-0">
            <dt class="col-sm-4">Client ID</dt>
            <dd class="col-sm-8"><code id="modal-login-id"></code></dd>
            <dt class="col-sm-4">Password</dt>
            <dd class="col-sm-8"><code id="modal-password"></code></dd>
          </dl>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="modal-done">Done</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/client-portal/public/js/api.js"></script>
  <script src="/client-portal/public/js/admin/clients.js"></script>
</body>
</html>
