<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — AccessDigital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/client-portal/public/css/app.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark navbar-expand-lg" style="background: var(--ad-primary);">
    <div class="container">
      <a class="navbar-brand" href="/client-portal/admin/dashboard">AccessDigital Admin</a>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-light" onclick="goBack()">Back</button>
        <a href="/client-portal/admin/templates" class="btn btn-sm btn-outline-light">Templates</a>
        <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Clients</h1>
      <a href="/client-portal/admin/clients/new" class="btn btn-primary">New Client</a>
    </div>
    <div class="d-flex gap-2 mb-3">
      <button class="btn btn-sm btn-primary type-filter" data-type="">All</button>
      <button class="btn btn-sm btn-outline-primary type-filter" data-type="A">Client A</button>
      <button class="btn btn-sm btn-outline-primary type-filter" data-type="B">Client B</button>
    </div>
    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th>Company</th>
              <th>Client ID</th>
              <th>Type</th>
              <th>Commercial Mode</th>
              <th>Onboarding</th>
              <th>Status</th>
              <th>Created</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="clients-body">
            <tr><td colspan="8" class="text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/client-portal/public/js/api.js"></script>
  <script src="/client-portal/public/js/admin/dashboard.js"></script>
</body>
</html>
