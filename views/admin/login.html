<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — AccessDigital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/client-portal/public/css/app.css" rel="stylesheet">
  <style>
    body {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('/client-portal/public/open gate.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
    }
    .hero-card {
      position: relative;
      z-index: 1;
      transition: opacity 0.5s ease-out;
    }
    .hero-card.fading-out {
      opacity: 0;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }
    /* Video overlay for gate opening animation */
    .gate-video-overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      width: 100vw;
      height: 100vh;
      background: transparent;
      display: none;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      pointer-events: none;
    }
    .gate-video-overlay.playing {
      display: block;
      opacity: 1;
    }
    .gate-video-overlay video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 1;
    }
    /* Keep login content visible during video */
    .hero-card.video-playing {
      position: relative;
    }
  </style>
</head>
<body>
  <!-- Video overlay for gate opening animation -->
  <div class="gate-video-overlay" id="gate-video-overlay">
    <video id="gate-opening-video" preload="auto" playsinline>
      <source src="/client-portal/public/open_the_gate.mp4" type="video/mp4">
    </video>
  </div>

  <div class="container hero-card" id="hero-card">
    <div class="card p-4">
      <h1 class="h4 mb-3">Admin Login</h1>
      <form id="login-form">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" name="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" name="password" id="password" required>
            <button type="button" class="btn btn-outline-secondary password-toggle" id="toggle-password">View</button>
          </div>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Login</button>
          <a href="/client-portal/" class="btn btn-outline-secondary">Back</a>
        </div>
      </form>
    </div>
  </div>
  <script src="/client-portal/public/js/api.js"></script>
  <script>
    // Reset video state on page load (fixes back button issue)
    window.addEventListener('pageshow', function(event) {
      const videoOverlay = document.getElementById('gate-video-overlay');
      const video = document.getElementById('gate-opening-video');
      const heroCard = document.getElementById('hero-card');
      
      if (videoOverlay) {
        videoOverlay.classList.remove('playing');
        videoOverlay.style.display = 'none';
      }
      if (video) {
        video.pause();
        video.currentTime = 0;
      }
      if (heroCard) {
        heroCard.classList.remove('fading-out', 'video-playing');
        heroCard.style.opacity = '1';
      }
    });

    bindPasswordToggle('password', 'toggle-password');
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await api('/auth/admin/login', {
          method: 'POST',
          body: { username: fd.get('username'), password: fd.get('password') },
          skipAuthRedirect: true,
        });
        playGateVideoAndRedirect('/client-portal/admin/dashboard');
      } catch (err) {
        showToast(err.message, 'danger');
      }
    });

    function playGateVideoAndRedirect(redirectUrl) {
      const videoOverlay = document.getElementById('gate-video-overlay');
      const video = document.getElementById('gate-opening-video');
      const heroCard = document.getElementById('hero-card');

      // Keep login card visible, add class to indicate video is playing
      if (heroCard) {
        heroCard.classList.add('video-playing');
      }

      // Show and play video immediately
      videoOverlay.classList.add('playing');
      videoOverlay.style.display = 'block';
      
      // Reset and play video
      video.currentTime = 0;
      video.play().catch((err) => {
        console.error('Video playback failed:', err);
        // If video fails, redirect immediately
        window.location.href = redirectUrl;
      });

      // Redirect when video ends
      video.addEventListener('ended', () => {
        window.location.href = redirectUrl;
      }, { once: true });

      // Fallback: redirect after max 10 seconds if video doesn't end
      setTimeout(() => {
        if (video.paused || video.ended) return;
        window.location.href = redirectUrl;
      }, 10000);
    }
  </script>
</body>
</html>
