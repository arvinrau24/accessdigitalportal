<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Login — AccessDigital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/client-portal/public/css/app.css" rel="stylesheet">
</head>
<body>
  <div class="container hero-card">
    <div class="card p-4">
      <h1 class="h4 mb-3">Client Login</h1>
      <form id="login-form">
        <div class="mb-3">
          <label class="form-label">Client ID</label>
          <input type="text" class="form-control" name="clientLoginId" required placeholder="company_name">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" name="password" id="password" required>
            <button type="button" class="btn btn-outline-secondary password-toggle" id="toggle-password">View</button>
          </div>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Login</button>
          <a href="/client-portal/" class="btn btn-outline-secondary">Back</a>
        </div>
      </form>
    </div>
  </div>
  <script src="/client-portal/public/js/api.js"></script>
  <script>
    bindPasswordToggle('password', 'toggle-password');
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await api('/auth/client/login', {
          method: 'POST',
          body: { clientLoginId: fd.get('clientLoginId'), password: fd.get('password') },
          skipAuthRedirect: true,
        });
        window.location.href = '/client-portal/client/dashboard';
      } catch (err) {
        showToast(err.message, 'danger');
      }
    });
  </script>
</body>
</html>
